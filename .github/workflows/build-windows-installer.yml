name: Build AquaPredict Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Java application
        run: mvn -B -f java-app/pom.xml clean package
      - name: Build standalone Python engine
        run: pyinstaller --noconfirm --clean --onedir --name AquaPredictEngine --distpath packaging/python-dist --workpath packaging/pyinstaller-work python-engine/main.py
      - name: Prepare installer input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/input, packaging/dist | Out-Null
          Copy-Item java-app/target/AquaPredict.jar packaging/input/AquaPredict.jar
          Copy-Item packaging/python-dist/AquaPredictEngine packaging/input/AquaPredictEngine -Recurse
      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) { choco install wixtoolset --no-progress -y }
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (Test-Path $wixBin) { Add-Content -Path $env:GITHUB_PATH -Value $wixBin }
      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = "1.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $version = $env:GITHUB_REF_NAME.Substring(1) }
          jpackage --type exe --name AquaPredict --app-version $version --input packaging/input --main-jar AquaPredict.jar --main-class com.aquapredict.AquaPredictApp --dest packaging/dist --vendor AquaPredict --description "AquaPredict Smart Water Analysis and Simulation System" --win-menu --win-shortcut --verbose
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaPredict-Windows-Installer
          path: packaging/dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/*.exe
          generate_release_notes: true
